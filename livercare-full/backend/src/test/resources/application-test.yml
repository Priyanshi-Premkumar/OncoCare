spring:
  datasource:
    url: jdbc:h2:mem:livercaretest;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

aws:
  bedrock:
    enabled: false

ai:
  drift-engine:
    base-url: http://localhost:9999
    timeout-seconds: 1
    retry-attempts: 1
