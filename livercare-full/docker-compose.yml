version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: livercare-db
    environment:
      POSTGRES_DB:       livercaredb
      POSTGRES_USER:     livercare
      POSTGRES_PASSWORD: livercare_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livercare -d livercaredb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Python AI Drift Engine ───────────────────────────────
  ai-engine:
    build: ./ai-engine
    container_name: livercare-ai-engine
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ── Spring Boot Backend ──────────────────────────────────
  backend:
    build: ./backend
    container_name: livercare-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST:         postgres
      DB_PORT:         5432
      DB_NAME:         livercaredb
      DB_USER:         livercare
      DB_PASS:         livercare_secret
      ADMIN_USER:      admin
      ADMIN_PASS:      livercare2024
      AI_ENGINE_URL:   http://ai-engine:8000
      AWS_REGION:      ${AWS_REGION:-us-east-1}
      BEDROCK_ENABLED: ${BEDROCK_ENABLED:-true}
      # AWS credentials must be provided via env or IAM role
      AWS_ACCESS_KEY_ID:     ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    restart: unless-stopped

  # ── React Frontend ───────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: livercare-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
